buildscript {
    repositories {
        maven { url = uri('/root/maven/localMvnRepository') }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.0'
    }
}

allprojects {
    repositories {
        maven { url = uri('/root/maven/localMvnRepository') }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
