<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1c1f">
  <meta name="description" content="EffectCraft: motion graphics and visual effects in the browser">
  <title>EffectCraft</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-256.png">
  <link rel="stylesheet" href="keyboard.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1c1f; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; color: #c9c9cc;
      font: 14px/1.4 system-ui, sans-serif; pointer-events: none;
    }
    #loading img { width: 56px; height: 56px; }
    #loading .err { color: #ff8a7a; white-space: pre-wrap; max-width: 70ch; pointer-events: auto; }
    #device-lost {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
      align-items: center; justify-content: center; padding: 16px; text-align: center;
      background: rgb(18 18 18 / 0.85); color: #c8c8c8; font: 14px/1.4 system-ui, sans-serif;
    }
    #device-lost strong { color: #e3e3e3; font-size: 16px; }
    #device-lost p { margin: 0; max-width: 60ch; }
    #device-lost small { color: #8c8c8c; font-size: 12px; }
    #device-lost div { display: flex; gap: 8px; }
    #device-lost button {
      padding: 6px 14px; border: 1px solid #3a3a3a; border-radius: 4px;
      background: #232323; color: #e3e3e3; font: inherit; cursor: pointer;
    }
    #device-lost button:hover { background: #303030; }
    #device-lost button:last-child { background: #2d8ceb; border-color: #2d8ceb; }
    #device-lost button:last-child:hover { background: #4aa0f5; }
    #device-lost button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <canvas id="effectcraft_canvas"></canvas>
  <div id="loading"><img src="favicon.svg" alt=""><div id="status">Loading EffectCraft…</div><div id="substatus" style="font-size:12px;color:#8a8c99;">Initializing…</div></div>
  <script type="module">
    import init, * as ec from "./effectcraft_web.js";
    const t0 = performance.now();
    window.effectcraftLoad = {};
    // The agent / test API: the desktop control channel as promises (docs/web.md).
    window.effectcraft = {
      request: (method, params) => ec.request(method, params ?? {}),
      execute: (command, params) => ec.request("engine.execute", { command, params: params ?? {} }),
      commands: () => ec.request("engine.commands", {}),
      inspect: () => ec.request("ui.inspect", {}),
      screenshot: (params) => ec.request("ui.screenshot", params ?? {}),
      renderFrame: (params) => ec.request("render.frame", { base64: true, ...(params ?? {}) }),
      files: () => ec.files(),
      readFile: (path) => ec.readFile(path),
      addFile: async (fileOrUrl, name) => {
        let bytes;
        if (typeof fileOrUrl === "string") {
          bytes = new Uint8Array(await (await fetch(fileOrUrl)).arrayBuffer());
          name = name ?? fileOrUrl.split("/").pop();
        } else {
          bytes = new Uint8Array(await fileOrUrl.arrayBuffer());
          name = name ?? fileOrUrl.name;
        }
        return ec.addFile(name, bytes);
      },
      info: () => ({
        ...ec.info(),
        crossOriginIsolated: self.crossOriginIsolated,
        webgpu: !!navigator.gpu,
        serviceWorker: !!(navigator.serviceWorker && navigator.serviceWorker.controller),
        load: window.effectcraftLoad,
      }),
      // Browser storage (OPFS / IndexedDB): save without downloading, list, remove, wait for writes.
      saveToBrowser: (path) => ec.saveToBrowser(path ?? undefined),
      listStored: () => ec.listStored(),
      removeStored: (path) => ec.removeStored(path),
      flush: () => ec.flush(),
      // A frame rendered in a frame worker (its GPU by default) vs the page's CPU: {maxDiff, meanDiff, over4, …}.
      workerFrameCheck: (params) => ec.workerFrameCheck(params ?? {}).then(JSON.parse),
    };
    // Offline start and install (PWA): the service worker caches the app's files.
    if ("serviceWorker" in navigator && !new URLSearchParams(location.search).has("nosw")) {
      navigator.serviceWorker.register("sw.js").catch((e) => console.warn("service worker:", e));
    }
    const setStatus = (msg) => {
      const sub = document.getElementById("substatus");
      if (sub) sub.textContent = msg;
      console.log("[LoadStep]", msg);
      if (window.AndroidBridge && window.AndroidBridge.log) {
        window.AndroidBridge.log("step", msg);
      }
    };

    window.addEventListener("error", (ev) => {
      console.error("[UncaughtError]", ev.message, ev.filename, ev.lineno, ev.error);
      if (window.AndroidBridge && window.AndroidBridge.reportError) {
        window.AndroidBridge.reportError(ev.message || "Uncaught Error", ev.error ? (ev.error.stack || String(ev.error)) : `${ev.filename}:${ev.lineno}`);
      }
    });

    window.addEventListener("unhandledrejection", (ev) => {
      console.error("[UnhandledRejection]", ev.reason);
      if (window.AndroidBridge && window.AndroidBridge.reportError) {
        window.AndroidBridge.reportError("Unhandled Rejection", ev.reason ? (ev.reason.stack || String(ev.reason)) : "Promise rejected");
      }
    });

    try {
      setStatus("Loading WebAssembly module…");
      const wasmUrl = new URL("effectcraft_web_bg.wasm", location.href);
      let module;
      try {
        module = await WebAssembly.compileStreaming(fetch(wasmUrl));
      } catch (streamErr) {
        console.warn("compileStreaming fallback:", streamErr);
        setStatus("Compiling WebAssembly module…");
        const resp = await fetch(wasmUrl);
        const bytes = await resp.arrayBuffer();
        module = await WebAssembly.compile(bytes);
      }
      setStatus("Initializing Rust runtime…");
      await init({ module_or_path: module });
      // Clear reference so V8 can free compilation buffers before engine allocations
      module = null;
      window.effectcraftLoad.wasmMs = performance.now() - t0;

      setStatus("Starting EffectCraft UI & Canvas…");
      await ec.start("effectcraft_canvas");
      window.effectcraftLoad.readyMs = performance.now() - t0;
      if (window.AndroidBridge && window.AndroidBridge.onAppReady) {
        window.AndroidBridge.onAppReady();
      }
    } catch (e) {
      console.error("EffectCraft start error:", e);
      const errMsg = (e && (e.stack || e.message)) ? String(e.stack || e.message) : String(e);
      if (window.AndroidBridge && window.AndroidBridge.reportError) {
        window.AndroidBridge.reportError(String(e), errMsg);
      }
      const s = document.getElementById("status");
      const sub = document.getElementById("substatus");
      if (s) {
        s.className = "err";
        s.textContent = "EffectCraft could not start:\n" + errMsg;
      }
      if (sub) {
        sub.innerHTML = "<div style='display:flex;gap:10px;margin-top:14px;'>" +
          "<button onclick='location.reload()' style='padding:10px 20px;background:#2d8ceb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;'>Retry</button>" +
          "<button onclick='location.href=\"index.html?nosw&noworkers&home&empty&webgl\"' style='padding:10px 20px;background:#383942;color:#e3e3e3;border:1px solid #555;border-radius:6px;cursor:pointer;'>Clean Home Start</button>" +
          "</div>";
      }
      window.effectcraftLoad.error = errMsg;
    }
  </script>
  <script src="keyboard.js"></script>
</body>
</html>
